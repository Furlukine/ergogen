units:
  # Proxy spacing variables
  kx: cx
  ky: cy
  # Padding variables
  px: kx + 4
  py: ky + 4
  # Setting variables to adjust web
  # preview to support choc switch
  $default_width: cx
  $default_height: cy
  # double padding values
  dpx: kx + 8
  dpy: ky + 8
  # defaults to M2 screws
  screwSize: 1.5
  standoffSize: 2.5
points:
  zones:
    matrix:
      anchor:
        # Fix placement on KiCAD sheet
        shift: [100, -150]
      key:
        padding: 1ky
        spread: 1kx
      columns:
        outer:
          key.column_net: P14
        pinky:
          key.column_net: P16
        ring:
          key:
            stagger: 14
            column_net: P10
        middle:
          key:
            stagger: 2
            column_net: P7
        index:
          key:
            stagger: -6
            column_net: P8
        inner:
          key:
            stagger: -3
            column_net: P9
      rows:
        bottom:
          row_net: P18
        home:
          row_net: P19
        top:
          row_net: P20
        num:
          row_net: P21
    thumbs:
      key:
        padding: 1ky
        spread: 1kx
      anchor:
        ref: matrix_inner_bottom
        shift: [6, -1ky + -3.5]
      columns:
        layer:
          key:
            splay: -20
            column_net: P8
        space:
          key:
            width: 1.5kx
            splay: -90
            shift: [7.5, 0]
            column_net: P9
      rows:
        cluster:
          row_net: P15
outlines:
  raw:
    - what: rectangle
      where: true
      size: [px, py]
  # This is not strictly needed
  # it's used to show overlap between
  # demo.dxf and keys.dxf
  keys:
    - what: rectangle
      where: true
      bound: false
      size: [kx-0.5, ky-0.5]
  holes:
    - what: rectangle
      where: true
      size: [13.8, 13.8]
  board_left:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_num
          shift: [-.5px, .5py+16]
        - ref: matrix_middle_num
          shift: [.5px, .5py]
        - ref: matrix_index_num
          shift: [-.5px+4, .5py+1]
        - ref: matrix_index_num
          shift: [.5px, .5py+1]
        - ref: matrix_inner_num
          shift: [-.5px+4, .5py]
        - ref: matrix_inner_num
          shift: [.5px, .5py]
        - ref: matrix_inner_bottom
          shift: [.5px, -.5py+2.4]
        # left bottom of board
        - ref: thumbs_layer_cluster
          shift: [.5px, .5py+3]
        - ref: thumbs_space_cluster
          shift: [-.5px-3, -.5py+6]
        - ref: thumbs_space_cluster
          shift: [-.5px-3, .5py]
        - ref: thumbs_space_cluster
          shift: [.75px-2.5, .5py]
        - ref: thumbs_space_cluster
          shift: [.75px-2.5, -.5py]
        - ref: thumbs_layer_cluster
          shift: [.2px-.5, -.5py-1]
        - ref: thumbs_layer_cluster
          shift: [-.5px, -.5py-1]
        - ref: thumbs_layer_cluster
          shift: [-.665px, -.5py+9]
        - ref: matrix_middle_bottom
          shift: [-.5px+2, -.5py-2]
        - ref: matrix_ring_bottom
          shift: [-.5px+4,-.5py]
        - ref: matrix_pinky_bottom
          shift: [.5px, -.5py]
        - ref: matrix_outer_bottom
          shift: [-.5px, -.5py]
      fillet: 1.6
  xlBoard:
    - what: polygon
      operation: stack
      points:
        - ref: matrix_outer_num
          shift: [-.5dpx, .5dpy+16]
        - ref: matrix_middle_num
          shift: [.5dpx, .5dpy]
        - ref: matrix_index_num
          shift: [-.5dpx+8, .5dpy+1]
        - ref: matrix_index_num
          shift: [.5dpx, .5dpy+1]
        - ref: matrix_inner_num
          shift: [-.5dpx+8, .5dpy]
        - ref: matrix_inner_num
          shift: [.5dpx, .5dpy]
        - ref: matrix_inner_bottom
          shift: [.5dpx, -.5dpy+6]
        # left bottom of board
        - ref: thumbs_layer_cluster
          shift: [.5dpx, .5dpy+3]
        - ref: thumbs_space_cluster
          shift: [-.5dpx-3, -.5dpy+10]
        - ref: thumbs_space_cluster
          shift: [-.5dpx-3, .5dpy]
        - ref: thumbs_space_cluster
          shift: [.6dpx+.5, .5dpy]
        - ref: thumbs_space_cluster
          shift: [.6dpx+.5, -.5dpy+.5]
        - ref: thumbs_layer_cluster
          shift: [.2dpx-2.3, -.5dpy-2.5]
        - ref: thumbs_layer_cluster
          shift: [-.5dpx, -.5dpy-2.5]
        - ref: thumbs_layer_cluster
          shift: [-.5dpx-4, -.5dpy+8.3]
        - ref: matrix_middle_bottom
          shift: [0, -.5dpy-3]
        - ref: matrix_ring_bottom
          shift: [-.5dpx+8,-.5dpy]
        - ref: matrix_pinky_bottom
          shift: [.5dpx, -.5dpy]
        - ref: matrix_outer_bottom
          shift: [-.5dpx, -.5dpy]
      fillet: 1.6
  combo:
    - name: board_left
    - operation: stack
      name: keys
  fullCombo:
    - name: combo
    - operation: stack
      name: xlBoard
  mounting:
    - what: circle
      radius: screwSize
      where:
        ref: [matrix_outer_num]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: screwSize
      where:
        ref: [matrix_outer_bottom]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: screwSize
      where:
        ref: [matrix_index_num]
        shift: [0.5kx, -0.4ky]
    - what: circle
      radius: screwSize
      where:
        ref: [matrix_index_bottom]
        shift: [0.5kx, -0.35ky]
  standoff:
    - what: circle
      radius: standoffSize
      where:
        ref: [matrix_outer_num]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: standoffSize
      where:
        ref: [matrix_outer_bottom]
        shift: [0.5kx, -0.3ky]
    - what: circle
      radius: standoffSize
      where:
        ref: [matrix_index_num]
        shift: [0.5kx, -0.4ky]
    - what: circle
      radius: standoffSize
      where:
        ref: [matrix_index_bottom]
        shift: [0.5kx, -0.35ky]
  allMounting:
    - name: mounting
    - operation: stack
      name: standoff
  everythingCombined:
    - name: allMounting
    - operation: stack
      name: fullCombo
  plate:
    - name: board_left
    - operation: stack
      name: holes
  plateTest:
    - name: plate
    - operation: stack
      name: keys
pcbs:
  aconcagua:
    outlines:
      main:
        outline: board_left
    footprints:
      choc_hotswap:
        what: choc
        where: true
        params:
          keycaps: true
          reverse: false
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: diode
        where: true
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5]
      promicro:
        what: promicro
        params:
          orientation: "down"
        where:
          ref: [matrix_outer_num]
          shift: [.5px-3,py-3.5]
          rotate: 0
      holeTopLeft:
        what: ceoloide/mounting_hole_plated
        where:
          ref: [matrix_outer_num]
          shift: [0.5kx, -0.3ky]
      holeBottomLeft:
        what: ceoloide/mounting_hole_plated
        where:
          ref: [matrix_outer_bottom]
          shift: [0.5kx, -0.3ky]
      holeTopInnerLeft:
        what: ceoloide/mounting_hole_plated
        where:
          ref: [matrix_index_num]
          shift: [0.5kx, -0.4ky]
      holeBottomInnerLeft:
        what: ceoloide/mounting_hole_plated
        where:
          ref: [matrix_index_bottom]
          shift: [0.5kx, -0.35ky]
cases:
  bottom:
    - name: board_left
      extrude: 1
  xlBottom:
    - name: xlBoard
      extrude: 1
  _outerWall:
    - name: xlBoard
      extrude: 5.6
  _innerWall:
    - name: board_left
      extrude: 5.6
  wall:
    - what: case
      name: _outerWall
      operation: add
    - what: case
      name: _innerWall
      operation: subtract
  _holes:
    - name: mounting
      extrude: 4
  _standoffs:
    - name: standoff
      extrude: 4
  case:
    - what: case
      name: _standoffs
      operation: add
    - what: case
      name: _holes
      operation: subtract
    - what: case
      name: xlBottom
      operation: add
    - what: case
      name: wall
      operation: add